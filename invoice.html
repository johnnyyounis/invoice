<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Invoice</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <style>
      /* Layout: editor form on the left, live invoice preview on the right; stacked on phones. */
      :root {
        --bg: #e9edf2;
        --panel: #f8fafc;
        --paper: #ffffff;
        --ink: #16243a;
        --muted: #617088;
        --line: #cfd7e2;
        --brand: #1f3fa3;
        --brand-ink: #ffffff;
        --amber: #b86e00;
        --danger: #b3261e;
        --sans:
          "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1420;
          --panel: #151f2f;
          --paper: #1b2739;
          --ink: #e7edf7;
          --muted: #97a6be;
          --line: #2b3a52;
          --brand: #7c9bff;
          --brand-ink: #0b1220;
          --amber: #f0b056;
          --danger: #ff8a80;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1420;
        --panel: #151f2f;
        --paper: #1b2739;
        --ink: #e7edf7;
        --muted: #97a6be;
        --line: #2b3a52;
        --brand: #7c9bff;
        --brand-ink: #0b1220;
        --amber: #f0b056;
        --danger: #ff8a80;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.45;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 22px 40px;
      }
      .wrap {
        max-width: 1020px;
        margin: 0 auto;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .sample {
        font-size: 12px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
      }
      @media (min-width: 860px) {
        .grid {
          grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
          align-items: start;
        }
        .preview {
          position: sticky;
          top: 16px;
        }
      }
      .editor {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .f {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .f label,
      .sec {
        font-size: 12px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }
      input {
        font: inherit;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 11px;
        width: 100%;
        min-width: 0;
      }
      input[type="number"] {
        font-family: var(--mono);
        font-size: 15px;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 1px;
      }
      .items {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .it {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 64px 92px 36px;
        gap: 8px;
        align-items: center;
      }
      .it .d {
        grid-column: 1/-1;
      }
      .it input {
        padding: 9px 9px;
      }
      .x {
        height: 38px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--danger);
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
      }
      .ghost {
        font: inherit;
        font-weight: 500;
        background: transparent;
        border: 1px dashed var(--brand);
        color: var(--brand);
        border-radius: 6px;
        padding: 10px;
        cursor: pointer;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        cursor: pointer;
        background: var(--brand);
        color: var(--brand-ink);
        flex: 1 1 160px;
      }
      .btn.alt {
        background: #ffffff;
        color: #16243a;
        border: 1px solid var(--line);
      }
      .note {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }
      /* invoice paper */
      .paper {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 26px 22px;
        box-shadow: 0 1px 0 var(--line);
      }
      .ph {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 14px;
      }
      .ph h2 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .ph .no {
        font-family: var(--mono);
        text-align: right;
        font-size: 14px;
      }
      .ph .no b {
        display: block;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--muted);
        font-weight: 500;
      }
      .bill {
        margin: 16px 0;
        font-size: 15px;
      }
      .bill span {
        display: block;
        font-size: 12px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
        min-width: 380px;
      }
      th {
        font-size: 12px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
        text-align: left;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th.r,
      td.r {
        text-align: right;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        padding-left: 10px;
      }
      .tot {
        margin: 14px 0 0 auto;
        width: min(100%, 300px);
        font-family: var(--mono);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .tot div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 4px 0;
      }
      .tot .g {
        border-top: 2px solid var(--ink);
        margin-top: 6px;
        padding-top: 9px;
        font-size: 18px;
        font-weight: 500;
      }
      .tot .l {
        color: var(--muted);
      }
      .foot {
        margin-top: 20px;
        font-size: 13px;
        color: var(--muted);
      }
      .business-heading {
        min-width: 0;
      }
      .pdf-artwork {
        display: block;
        object-fit: contain;
      }
      #p-logo {
        max-width: 180px;
        max-height: 100px;
        margin-bottom: 12px;
      }
      #p-signature {
        max-width: 220px;
        max-height: 100px;
        margin: 18px 0 0 auto;
      }
      .invoice-summary {
        break-inside: avoid;
      }
      .upload-status {
        overflow-wrap: anywhere;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      @media (max-width: 420px) {
        .it {
          grid-template-columns: minmax(0, 1fr) 54px 80px 34px;
        }
        .paper {
          padding: 20px 16px;
        }
      }
      @media print {
        @page {
          margin: 0;
        }
        .preview {
          position: static;
        }
        tr,
        .tot {
          break-inside: avoid;
        }
        body {
          background: #fff;
          color: #000;
          padding: 15mm;
        }
        .editor,
        .top,
        .actions,
        .note {
          display: none !important;
        }
        .grid {
          display: block;
        }
        .paper {
          border: 0;
          box-shadow: none;
          padding: 0;
          background: #fff;
          color: #000;
        }
        :root {
          --ink: #000;
          --muted: #444;
          --line: #bbb;
          --paper: #fff;
        }
      }
      html {
        color-scheme: light;
      }
      body {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="grid">
        <section class="editor" aria-label="Invoice details">
          <div class="f">
            <label for="logo">Business logo (photo or PDF)</label>
            <input
              id="logo"
              type="file"
              accept="image/*,application/pdf,.pdf"
              aria-describedby="logo-status"
            />
            <p class="note upload-status" id="logo-status" role="status">
              Choose a photo or PDF (up to 10 MB) to appear above your business
              name.
            </p>
            <button class="ghost" id="remove-logo" type="button" hidden>
              Remove logo
            </button>
          </div>
          <div class="row">
            <div class="f">
              <label for="biz">Your business</label><input id="biz" />
            </div>
            <div class="f">
              <label for="no">Invoice no.</label><input id="no" />
            </div>
          </div>
          <div class="row">
            <div class="f">
              <label for="cli">Client</label><input id="cli" />
            </div>
            <div class="f">
              <label for="dt">Date</label><input id="dt" type="date" />
            </div>
          </div>
          <div><span class="sec">Items</span></div>
          <div class="items" id="items"></div>
          <button class="ghost" id="add" type="button">+ Add item</button>
          <div class="row">
            <div class="f">
              <label for="disc">Discount %</label
              ><input id="disc" type="number" min="0" max="100" step="1" />
            </div>
            <div class="f">
              <label for="vat">VAT %</label
              ><input id="vat" type="number" min="0" max="100" step="1" />
            </div>
          </div>
          <div class="f">
            <label for="rate">Rate (LBP per $1), leave blank to hide LBP</label
            ><input id="rate" type="number" min="0" step="100" />
          </div>
          <div class="actions">
            <div class="f" style="width: 100%">
              <label for="signature">Signature (photo or PDF)</label>
              <input
                id="signature"
                type="file"
                accept="image/*,application/pdf,.pdf"
                aria-describedby="signature-status"
              />
              <p class="note upload-status" id="signature-status" role="status">
                Choose a photo or PDF (up to 10 MB) to appear below the total.
              </p>
              <button class="ghost" id="remove-signature" type="button" hidden>
                Remove signature
              </button>
            </div>
            <button
              class="btn"
              id="pdf"
              type="button"
              style="background: #1f3fa3; color: #ffffff"
            >
              Save as PDF
            </button>
            <button class="btn alt" id="new" type="button">New invoice</button>
          </div>
        </section>

        <section class="preview" aria-label="Invoice preview">
          <div class="paper" id="paper">
            <div class="ph">
              <div class="business-heading">
                <img
                  class="pdf-artwork"
                  id="p-logo"
                  alt="Business logo"
                  hidden
                />
                <h2 id="p-biz"></h2>
              </div>
              <div class="no">
                <b>INVOICE</b><span id="p-no"></span><br /><span
                  id="p-dt"
                ></span>
              </div>
            </div>
            <div class="bill">
              <span>Billed to</span>
              <div id="p-cli"></div>
            </div>
            <div class="tw">
              <table>
                <thead>
                  <tr>
                    <th>Description</th>
                    <th class="r">Qty</th>
                    <th class="r">Price</th>
                    <th class="r">Amount</th>
                  </tr>
                </thead>
                <tbody id="p-rows"></tbody>
              </table>
            </div>
            <div class="invoice-summary">
              <div class="tot" id="p-tot"></div>
              <img
                class="pdf-artwork"
                id="p-signature"
                alt="Signature"
                hidden
              />
            </div>
            <p class="foot"></p>
          </div>
        </section>
      </div>
    </div>

    <script>
      var items = [{ d: "", q: "", p: "" }];
      function $(id) {
        return document.getElementById(id);
      }
      function usd(n) {
        return (
          "$" +
          n.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      }
      function num(v) {
        var n = parseFloat(v);
        return isFinite(n) ? n : 0;
      }
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      function fmtDate(v) {
        if (!v) return "";
        var p = v.split("-");
        return p[2] + "/" + p[1] + "/" + p[0];
      }

      function drawEditor() {
        $("items").innerHTML = items
          .map(function (it, i) {
            return (
              '<div class="it"><input class="d" data-i="' +
              i +
              '" data-f="d" value="' +
              esc(it.d) +
              '" placeholder="Description" aria-label="Item ' +
              (i + 1) +
              ' description">' +
              '<input type="number" min="0" step="1" data-i="' +
              i +
              '" data-f="q" value="' +
              esc(it.q) +
              '" aria-label="Quantity">' +
              '<input type="number" min="0" step="0.01" data-i="' +
              i +
              '" data-f="p" value="' +
              esc(it.p) +
              '" aria-label="Unit price in dollars">' +
              '<button class="x" type="button" data-x="' +
              i +
              '" aria-label="Remove item ' +
              (i + 1) +
              '">×</button></div>'
            );
          })
          .join("");
      }
      function calc() {
        var sub = 0;
        items.forEach(function (it) {
          sub += num(it.q) * num(it.p);
        });
        var dp = num($("disc").value),
          vp = num($("vat").value);
        var disc = (sub * dp) / 100,
          taxed = sub - disc,
          vat = (taxed * vp) / 100,
          total = taxed + vat,
          rate = num($("rate").value);
        return {
          sub: sub,
          dp: dp,
          disc: disc,
          vp: vp,
          vat: vat,
          total: total,
          rate: rate,
        };
      }
      function drawPreview() {
        var c = calc();
        $("p-biz").textContent = $("biz").value;
        $("p-no").textContent = $("no").value;
        $("p-dt").textContent = fmtDate($("dt").value);
        $("p-cli").textContent = $("cli").value;
        $("p-rows").innerHTML = items
          .filter(function (it) {
            return it.d !== "" || it.q !== "" || it.p !== "";
          })
          .map(function (it) {
            return (
              "<tr><td>" +
              esc(it.d || "Item") +
              '</td><td class="r">' +
              num(it.q) +
              '</td><td class="r">' +
              usd(num(it.p)) +
              '</td><td class="r">' +
              usd(num(it.q) * num(it.p)) +
              "</td></tr>"
            );
          })
          .join("");
        var h =
          '<div class="l"><span>Subtotal</span><span>' +
          usd(c.sub) +
          "</span></div>";
        if (c.dp)
          h +=
            '<div class="l"><span>Discount ' +
            c.dp +
            "%</span><span>−" +
            usd(c.disc) +
            "</span></div>";
        if (c.vp)
          h +=
            '<div class="l"><span>VAT ' +
            c.vp +
            "%</span><span>" +
            usd(c.vat) +
            "</span></div>";
        h +=
          '<div class="g"><span>Total</span><span>' +
          usd(c.total) +
          "</span></div>";
        if (c.rate)
          h +=
            '<div class="l"><span>In LBP</span><span>' +
            Math.round(c.total * c.rate).toLocaleString("en-US") +
            "</span></div>";
        $("p-tot").innerHTML = h;
      }
      function text() {
        var c = calc(),
          L = [
            "*Invoice " + $("no").value + "* from " + ($("biz").value || "us"),
            "Date: " + fmtDate($("dt").value),
            "To: " + $("cli").value,
            "",
          ];
        items.forEach(function (it) {
          L.push(
            num(it.q) +
              " x " +
              (it.d || "Item") +
              "  " +
              usd(num(it.q) * num(it.p)),
          );
        });
        L.push("", "Subtotal: " + usd(c.sub));
        if (c.dp) L.push("Discount " + c.dp + "%: -" + usd(c.disc));
        if (c.vp) L.push("VAT " + c.vp + "%: " + usd(c.vat));
        L.push("*Total: " + usd(c.total) + "*");
        if (c.rate)
          L.push(
            "In LBP at " +
              c.rate.toLocaleString("en-US") +
              ": " +
              Math.round(c.total * c.rate).toLocaleString("en-US"),
          );
        return L.join("\n");
      }
      $("items").addEventListener("input", function (e) {
        var t = e.target,
          i = t.dataset.i,
          f = t.dataset.f;
        if (i == null) return;
        items[+i][f] = f === "d" ? t.value : t.value;
        drawPreview();
      });
      $("items").addEventListener("click", function (e) {
        var b = e.target.closest("[data-x]");
        if (!b) return;
        items.splice(+b.dataset.x, 1);
        if (!items.length) items.push({ d: "", q: "", p: "" });
        drawEditor();
        drawPreview();
      });
      $("add").addEventListener("click", function () {
        items.push({ d: "", q: "", p: "" });
        drawEditor();
        drawPreview();
        var d = $("items").querySelectorAll(".d");
        d[d.length - 1].focus();
      });
      ["biz", "no", "cli", "dt", "disc", "vat", "rate"].forEach(function (id) {
        $(id).addEventListener("input", drawPreview);
      });
      $("pdf").addEventListener("click", function () {
        window.print();
      });

      drawEditor();
      drawPreview();
    </script>
    <script src="pdf-artwork.js"></script>
    <script src="saved-invoices.js"></script>
  </body>
</html>
